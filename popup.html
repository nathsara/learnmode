<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      margin: 0;
      background-color: #f9fafb;
      color: #111827;
    }
    h2 { margin: 0 0 12px 0; font-size: 1.1rem; }
    .status-badge {
      display: block;
      text-align: center;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 14px;
    }
    .status-active { background-color: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
    .status-unlocked { background-color: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: #374151;
      margin: 10px 0 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    textarea, select, button {
      width: 100%;
      box-sizing: border-box;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      padding: 8px 10px;
      font-size: 0.85rem;
      font-family: inherit;
    }
    textarea { resize: vertical; min-height: 45px; }
    button {
      margin-top: 12px;
      background-color: #2563eb;
      color: white;
      border: none;
      font-weight: 600;
      padding: 10px;
      cursor: pointer;
      border-radius: 6px;
    }
    button:hover { background-color: #1d4ed8; }
    .btn-relock { background-color: #059669; }
    .btn-relock:hover { background-color: #047857; }
    .btn-secondary {
      background-color: #e5e7eb;
      color: #374151;
      font-size: 0.75rem;
      padding: 6px;
      margin-top: 8px;
    }
    .btn-secondary:hover { background-color: #d1d5db; }
    .hidden { display: none; }

    /* Calendar Grid Section */
    .section-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: #4b5563;
      margin: 16px 0 8px 0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-top: 1px solid #e5e7eb;
      padding-top: 12px;
    }
    .grid-container {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-bottom: 8px;
    }
    .day-cell {
      aspect-ratio: 1;
      border-radius: 4px;
      background-color: #e5e7eb;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      color: #6b7280;
      font-weight: 600;
      transition: transform 0.1s ease;
    }
    .day-cell:hover { transform: scale(1.1); }
    .color-none { background-color: #e5e7eb; color: #9ca3af; }
    .color-yellow { background-color: #fef08a; color: #854d0e; border: 1px solid #fde047; }
    .color-green { background-color: #86efac; color: #166534; border: 1px solid #4ade80; }
    .color-red { background-color: #fca5a5; color: #991b1b; border: 1px solid #f87171; }

    /* Log Details Drawer */
    .log-details {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 8px 10px;
      max-height: 100px;
      overflow-y: auto;
      font-size: 0.75rem;
    }
    .log-entry { padding: 4px 0; border-bottom: 1px solid #f3f4f6; }
    .log-entry:last-child { border-bottom: none; }
    .tag {
      font-weight: 700;
      font-size: 0.65rem;
      text-transform: uppercase;
      padding: 2px 4px;
      border-radius: 3px;
    }
    .tag-productive { background: #d1fae5; color: #065f46; }
    .tag-neutral { background: #fef3c7; color: #92400e; }
    .tag-unproductive { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <h2>LearnMode 🛡️</h2>
  
  <div id="status-badge" class="status-badge status-active">
    LearnMode Active (AI Blocked)
  </div>

  <div id="unlock-form">
    <label for="reason">Reason for Unlocking AI:</label>
    <textarea id="reason" placeholder="e.g., Debugging an edge case in my JS state listener..."></textarea>

    <label for="category">Activity Category:</label>
    <select id="category">
      <option value="productive">Productive (Green)</option>
      <option value="neutral">Neutral (Yellow)</option>
      <option value="unproductive">Unproductive (Red)</option>
    </select>

    <label for="timer">Auto-Relock After:</label>
    <select id="timer">
      <option value="1">1 Hour</option>
      <option value="3">3 Hours</option>
      <option value="5">5 Hours</option>
      <option value="12">12 Hours</option>
      <option value="24">24 Hours</option>
    </select>

    <button id="action-btn">Log Intent & Unlock AI</button>
  </div>

  <div id="relock-container" class="hidden">
    <button id="relock-btn" class="btn-relock">Re-Enable LearnMode Now</button>
  </div>

  <!-- Activity Grid Section -->
  <div class="section-title">14-Day Activity Log</div>
  <div id="calendar-grid" class="grid-container"></div>
  <div id="log-details" class="log-details">
    <span style="color:#9ca3af;">Click a day above to inspect logs.</span>
  </div>

  <button id="export-btn" class="btn-secondary">Export Logs to CSV</button>

  <script src="popup.js"></script>
</body>
</html>
