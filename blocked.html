<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blocked by Lemonade</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Times New Roman", Times, serif;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      max-width: 440px;
      width: 100%;
      text-align: center;
      padding: 40px 24px;
    }

    .badge {
      display: inline-block;
      font-size: 14px;
      padding: 4px 12px;
      border-radius: 4px;
      margin-bottom: 24px;
      color: #000000;
      background-color: #e7efc1;
    }

    .tag-productive {
      color: #005214;
      background-color: #c9e3aa;
    }

    .tag-neutral {
      color: #000000;
      background-color: #ebebeb;
    }

    .tag-unproductive {
      color: #662c00;
      background-color: #eba98f;
    }

    .icon {
      font-size: 48px;
      line-height: 1;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 26px;
      font-weight: normal;
      color: #000000;
      margin-bottom: 12px;
    }

    p {
      color: #000000;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .btn-exit {
      background-color: #ebebeb;
      color: #000000;
      border: none;
      padding: 10px 20px;
      font-size: 15px;
      font-family: "Times New Roman", Times, serif;
      cursor: pointer;
      border-radius: 4px;
    }

    .btn-exit:hover {
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">learnmode active!</div>
    <h1>blocked by lemonade 🍋</h1>
    <p>AI tools and AI Mode are currently disabled to add back learning's natural friction.</p>
    <button class="btn-exit" id="backBtn">Back</button>
  </div>

  <script src="blocked.js"></script>
</body>
</html>
